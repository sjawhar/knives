[package]
name = "knives"
version = "0.18.3"
description = "Multi-fork, multi-agent maintenance"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[[bin]]
name = "knives"
path = "src/main.rs"

[dependencies]
# Upstream jj-lib from crates.io, deliberately: this tool uses only stable public
# API (CommitId, Commit, StackedConfig, repo, SymbolResolver, UserSettings) and
# needs nothing from any fork, so it should not depend on one.
#
# Pinned exactly rather than floating because jj-lib's API is explicitly unstable
# between releases, and because the library has to agree with the installed `jj`
# binary about the on-disk repository format.
#
# No `watchman` feature: that was only ever a workaround for an unreleased tree
# where gitattributes.rs used tokio while tokio was optional. The published crate
# does not carry that code, so the workaround is not needed here.
jj-lib = "=0.43.0"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Only the `Stream` trait, to drain jj-lib's tree-diff streams with the same
# hand-rolled poll loop `block_on` uses for its futures. Already in the tree
# through jj-lib.
futures-core = "0.3"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
# The machine-default output encoding. Pinned to an immutable rev of our fork
# carrying TOON spec v4.1 (toon-format/toon-rust#79, awaiting upstream merge):
# this is a machine surface, so what agents read must not change under our
# feet. Swap back to the crates.io release (=0.6.0) once upstream cuts it.
# Default features ship the crate's CLI and TUI — clap, ratatui, a clipboard —
# plus a rejected license and three unmaintained-crate advisories; the encoder
# itself needs none of that.
toon-format = { version = "=0.5.0", git = "https://github.com/sjawhar/toon-rust", rev = "9f0a88fab65727a0384db1794b6a26e6fa5b2002", default-features = false }

[dev-dependencies]
filetime = "0.2"
insta = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
as_underscore = "deny"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Printing to stdout is this program's entire user interface, not a debugging
# leftover. Rendering stays pure: every command builds a String and one call
# site prints it.
print_stdout = "allow"
print_stderr = "allow"
