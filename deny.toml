[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# RUSTSEC-2026-0543 says chrono is unmaintained. It is of the kind
# `unmaintained`, it names every version of chrono, and it lists no patched
# version, so no upgrade of chrono clears it. knives does not depend on chrono
# itself: chrono comes into the build only through the exact jj-lib pin in
# Cargo.toml, directly and through interim, which jj-lib pulls in. jj-lib 0.47
# uses jiff in its place, so the move to jj-lib 0.47 removes chrono, and this
# entry goes with it.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained and the advisory lists no patched version; chrono comes in only through the exact jj-lib pin (directly and through interim); remove this entry with the move to jj-lib 0.47, which uses jiff" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "async-std", reason = "use tokio" },
    { name = "actix-web", reason = "use axum" },
]

[sources]
unknown-registry = "deny"
# No git dependencies except the one deliberate pin below: jj-lib in
# particular comes from crates.io, never from a fork. Any other git
# dependency appearing here fails CI.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# toon-format is pinned by rev to our fork carrying TOON spec v4.1 until
# upstream merges toon-format/toon-rust#79 and releases it; drop this
# allowance when the dependency returns to crates.io.
allow-git = ["https://github.com/sjawhar/toon-rust"]
