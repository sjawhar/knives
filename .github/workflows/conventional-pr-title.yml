name: Conventional PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

# A newer event on a pull request cancels its older check, waiting or running: the newest run reads
# the title as it is then, and every sjawhar repository shares one limit of 40 GitHub-hosted jobs.
concurrency:
  group: conventional-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-pr-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            chore
            docs
            ci
            test
            build
            tests
