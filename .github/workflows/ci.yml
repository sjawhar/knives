name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A superseded PR run tells us nothing, and this tree builds jj-lib.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses only stable options, so this needs no nightly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # src/jj.rs and tests/common/lab.rs shell out to a real `jj` binary, so the
      # suite needs one on PATH. taiki-e/install-action does not carry jj, hence the
      # release tarball. The version is read from the jj-lib pin in Cargo.toml rather
      # than hardcoded: the library and the binary must agree on the on-disk repo
      # format, so they cannot be allowed to drift apart.
      - name: Install jj
        run: |
          set -euo pipefail
          jj_version=$(sed -n 's/^jj-lib = "=\?\([0-9.]*\)".*/\1/p' Cargo.toml)
          if [ -z "$jj_version" ]; then
            echo 'could not read the jj-lib version from Cargo.toml' >&2
            exit 1
          fi
          archive="jj-v${jj_version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${jj_version}/${archive}" -o "$archive"
          # The tarball stores its entries under ./, so name the member explicitly.
          sudo tar xzf "$archive" -C /usr/local/bin ./jj
          jj --version
      - run: cargo nextest run --all-targets --all-features --workspace

  opencode-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint plugin
        run: bun run lint
      - name: Typecheck plugin
        run: bun run typecheck
      # The suite includes an import guard pinning the entry module's export surface:
      # OpenCode calls every exported function as a plugin, so a second export
      # breaks plugin loading. See plugin/knives.ts.
      - name: Test plugin
        run: bun run test:knives-plugin
        env:
          KNIVES_BIN: target/debug/knives

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: bnjbvr/cargo-machete@main

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `check all` includes RustSec advisory checks.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

# No miri job: the only `unsafe` in this tree is `std::env::set_var`/`remove_var`
# in tests, which Rust 2024 made unsafe. There is no pointer or aliasing work for
# miri to check, and its isolation cannot run the filesystem tests that matter.
